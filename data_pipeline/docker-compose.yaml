services:
  data_ingestion:
    build: .
    container_name: data-ingestion
    depends_on:
      db:
        condition: service_healthy  

  db:
    image: postgres:18
    container_name: pgdatabase
    ports:
      - "5432:5432"
    volumes:
      - ~/ny_taxi_postgres_2_data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=ny_taxi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]